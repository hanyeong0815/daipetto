version: "3.9"

services:
  frontend:
    container_name: daipetto-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://spring-api:8080
    depends_on:
      - spring-api
    networks:
      - daipetto-network

  spring-api:
    container_name: daipetto-spring-api
    build:
      context: ./spring-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./spring-api:/app
      - gradle-cache:/home/gradle/.gradle
    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-14}

      DJANGO_API_URL: http://django-api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - postgres
      - django-api
    networks:
      - daipetto-network

  django-api:
    container_name: daipetto-django-api
    build:
      context: ./django-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./django-api:/app
    environment:
      DJANGO_DEBUG: "True"

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - postgres
    networks:
      - daipetto-network

  postgres:
    container_name: daipetto-postgres
    image: postgres:16.9
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - daipetto-network

networks:
  daipetto-network:
    driver: bridge

volumes:
  postgres-data:
  gradle-cache:
