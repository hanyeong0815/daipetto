spring:
  datasource:
    url: jdbc:h2:mem:daipetto_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

jwt:
  secret: local-dev-only-secret-key-for-jwt-authentication-must-be-long-enough-please-change
  access-token-expiration-minutes: 30
  refresh-token-expiration-days: 14